plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wakhreek.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.wakhreek.app"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('WAKHREEK_KEYSTORE_PATH')
            def ksPassword = System.getenv('WAKHREEK_KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('WAKHREEK_KEY_ALIAS')
            def keyPasswordValue = System.getenv('WAKHREEK_KEY_PASSWORD')

            if (ksPath && ksPassword && keyAliasValue && keyPasswordValue) {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('WAKHREEK_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Reuse the exact official WakhReek icon already stored in /public.
// This copies pixels only; it does not redesign or alter the icon.
tasks.register('copyWakhreekIcon', Copy) {
    from("${rootProject.projectDir}/../public/wakhreek-512-v2.png")
    into("${projectDir}/src/main/res/drawable")
    rename { 'wakhreek_icon.png' }
}

preBuild.dependsOn(copyWakhreekIcon)
