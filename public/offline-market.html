<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0066ff"><title>WakhReek Marché — Hors connexion</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,Arial;background:#f5f7fb;color:#15253d}header{background:#0764d8;color:#fff;padding:18px}header h1{margin:0;font-size:24px}header p{margin:8px 0 0}.wrap{max-width:1100px;margin:auto;padding:18px}.notice{background:#fff4dc;border:1px solid #f0d38c;border-radius:12px;padding:14px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.card{background:white;border:1px solid #e1e6ee;border-radius:12px;padding:16px}.card h3{margin:0 0 7px}.card p{margin:6px 0;color:#52647b}button{border:0;border-radius:9px;padding:12px;background:#0764d8;color:white;font-weight:700;margin-top:12px}small{color:#53647b}h2{margin:22px 0 12px}</style></head><body><header><h1>🛍 WakhReek Marché</h1><p>Hors connexion · بدون إنترنت · Offline</p></header><main class="wrap"><div class="notice">Vous consultez une copie enregistrée du Marché. Les prix, stocks et disponibilités peuvent avoir changé.<br>هذه نسخة محفوظة من السوق، وقد تكون المعلومات تغيرت.<br><button onclick="location.href='/market'">Réessayer · إعادة المحاولة</button></div><small id="date"></small><h2>Boutiques · البوتيكات</h2><div id="shops" class="grid"></div><h2>Produits consultés · المنتجات</h2><div id="products" class="grid"></div></main><script>(function(){var raw;try{raw=localStorage.getItem('wakhreek_market_public_snapshot_v1')}catch(e){}var d;try{d=JSON.parse(raw||'null')}catch(e){}var shops=document.getElementById('shops'),products=document.getElementById('products');function el(tag,text,parent){var n=document.createElement(tag);n.textContent=String(text||'');parent.appendChild(n);return n}if(!d||!Array.isArray(d.shops)){el('p','Aucune boutique enregistrée. Ouvrez Marché une fois avec Internet. · افتح السوق بالإنترنت أولاً.',shops);el('p','Aucun produit enregistré.',products);return}if(d.savedAt)document.getElementById('date').textContent='Copie du '+new Date(d.savedAt).toLocaleString();var countries=new Map((d.countries||[]).map(function(c){return[c.id,c.name_fr||c.code]}));var cities=new Map((d.cities||[]).map(function(c){return[c.id,c.name]}));var counts=new Map();(d.products||[]).forEach(function(p){counts.set(p.boutique_id,(counts.get(p.boutique_id)||0)+1)});if(!d.shops.length)el('p','Aucune boutique enregistrée.',shops);d.shops.forEach(function(s){var card=el('article','',shops);card.className='card';el('h3',s.name,card);el('p',[countries.get(s.country_id),cities.get(s.city_id)].filter(Boolean).join(' · '),card);el('small',(counts.get(s.id)||0)+' produits enregistrés',card)});if(!(d.products||[]).length)el('p','Aucun produit enregistré.',products);(d.products||[]).forEach(function(p){var card=el('article','',products);card.className='card';el('h3',p.name,card);el('p',p.category||'',card);var shop=d.shops.find(function(s){return s.id===p.boutique_id});if(shop)el('small',shop.name,card)})})();</script></body></html>
