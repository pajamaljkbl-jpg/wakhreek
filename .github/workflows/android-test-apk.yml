name: Build WakhReek Android

on:
  workflow_dispatch:
  push:
    branches: [android-test]
    paths:
      - 'android-app/**'
      - 'public/wakhreek-512-v2.png'
      - '.github/workflows/android-test-apk.yml'

permissions:
  contents: write

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WakhReek-Android-Debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release-build:
    runs-on: ubuntu-latest
    env:
      WAKHREEK_KEYSTORE_BASE64: ${{ secrets.WAKHREEK_KEYSTORE_BASE64 }}
      WAKHREEK_KEYSTORE_PASSWORD: ${{ secrets.WAKHREEK_KEYSTORE_PASSWORD }}
      WAKHREEK_KEY_ALIAS: ${{ secrets.WAKHREEK_KEY_ALIAS }}
      WAKHREEK_KEY_PASSWORD: ${{ secrets.WAKHREEK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check release signing configuration
        id: signing
        shell: bash
        run: |
          if [ -n "$WAKHREEK_KEYSTORE_BASE64" ] && [ -n "$WAKHREEK_KEYSTORE_PASSWORD" ] && [ -n "$WAKHREEK_KEY_ALIAS" ] && [ -n "$WAKHREEK_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured yet; signed build is skipped."
          fi
      - name: Restore release keystore
        if: steps.signing.outputs.ready == 'true'
        run: printf '%s' "$WAKHREEK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wakhreek-release.jks"
      - name: Build signed release APK and AAB
        if: steps.signing.outputs.ready == 'true'
        working-directory: android-app
        env:
          WAKHREEK_KEYSTORE_PATH: ${{ runner.temp }}/wakhreek-release.jks
        run: gradle assembleRelease bundleRelease
      - name: Verify release signing
        if: steps.signing.outputs.ready == 'true'
        working-directory: android-app
        run: keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: WakhReek-Android-Release
          path: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Publish signed APK to main
        if: steps.signing.outputs.ready == 'true' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]')
        shell: bash
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/WakhReek-Android-1.0.0.apk"
          git fetch origin main
          git checkout main
          cp "$RUNNER_TEMP/WakhReek-Android-1.0.0.apk" public/WakhReek-Android-1.0.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/WakhReek-Android-1.0.0.apk
          if git diff --cached --quiet; then
            echo "APK already published on main."
            exit 0
          fi
          git commit -m "release: publish WakhReek Android 1.0.0 APK"
          git push origin HEAD:main
