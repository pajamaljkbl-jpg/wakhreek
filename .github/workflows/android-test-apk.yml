name: Build WakhReek Android

on:
  workflow_dispatch:
  push:
    branches: [android-test]
    paths:
      - 'android-app/**'
      - 'public/wakhreek-512-v2.png'
      - '.github/workflows/android-test-apk.yml'

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WakhReek-Android-Debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release-build:
    runs-on: ubuntu-latest
    if: ${{ secrets.WAKHREEK_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore release keystore
        env:
          WAKHREEK_KEYSTORE_BASE64: ${{ secrets.WAKHREEK_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$WAKHREEK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wakhreek-release.jks"
      - name: Build signed release APK and AAB
        working-directory: android-app
        env:
          WAKHREEK_KEYSTORE_PATH: ${{ runner.temp }}/wakhreek-release.jks
          WAKHREEK_KEYSTORE_PASSWORD: ${{ secrets.WAKHREEK_KEYSTORE_PASSWORD }}
          WAKHREEK_KEY_ALIAS: ${{ secrets.WAKHREEK_KEY_ALIAS }}
          WAKHREEK_KEY_PASSWORD: ${{ secrets.WAKHREEK_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease
      - name: Verify release signing
        working-directory: android-app
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WakhReek-Android-Release
          path: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
